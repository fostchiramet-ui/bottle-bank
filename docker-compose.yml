services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: bottlebank_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./db.sql:/bottlebank_db.sql
    healthcheck:
      test: mysqladmin ping -h localhost -u root -prootpassword
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: . 
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
    external: false